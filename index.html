<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastefy - Share Code & Text</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { background-color: #121418; color: #e1e4e8; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 240px; background-color: #181b20; border-right: 1px solid #282c34; display: flex; flex-direction: column; padding: 20px 15px; }
        .logo { font-size: 22px; font-weight: bold; color: #4db6ac; text-decoration: none; display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
        .nav-btn { background: #21262d; border: 1px solid #30363d; color: #fff; padding: 10px 15px; border-radius: 6px; cursor: pointer; text-align: left; font-weight: 500; margin-bottom: 10px; transition: 0.2s; }
        .nav-btn:hover { background: #2f363d; }
        
        /* Main Area */
        .main { flex: 1; display: flex; flex-direction: column; background-color: #0d1117; }
        .header { height: 60px; border-bottom: 1px solid #282c34; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background-color: #161b22; }
        .title-input { background: transparent; border: none; font-size: 18px; color: #fff; font-weight: 600; outline: none; width: 300px; }
        .actions { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: #238636; color: #fff; }
        .btn-primary:hover { background-color: #2ea043; }
        .btn-secondary { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
        .btn-secondary:hover { background-color: #30363d; }
        
        /* Code Editor Container */
        .editor-container { flex: 1; display: flex; padding: 15px; }
        .editor { flex: 1; background-color: #161b22; border: 1px solid #30363d; border-radius: 6px; display: flex; overflow: hidden; }
        .line-numbers { width: 45px; background-color: #0d1117; color: #484f58; text-align: right; padding: 15px 10px; font-family: monospace; font-size: 14px; user-select: none; line-height: 1.5; }
        textarea { flex: 1; background: transparent; border: none; color: #e6edf3; font-family: "Fira Code", monospace, Consolas, sans-serif; font-size: 14px; padding: 15px; resize: none; outline: none; line-height: 1.5; white-space: pre; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#" class="logo">📋 Pastefy</a>
        <button class="nav-btn" onclick="clearEditor()">➕ New Paste</button>
        <button class="nav-btn">📁 Folders</button>
        <button class="nav-btn">⚙️ Settings</button>
    </div>

    <!-- Main Workspace -->
    <div class="main">
        <div class="header">
            <input type="text" class="title-input" id="title" placeholder="Untitled paste..." value="My Script / Note">
            <div class="actions">
                <button class="btn btn-secondary" onclick="copyCode()">📋 Copy</button>
                <button class="btn btn-secondary" onclick="openRaw()">📄 Raw</button>
                <button class="btn btn-primary" onclick="savePaste()">💾 Save Paste</button>
            </div>
        </div>

        <div class="editor-container">
            <div class="editor">
                <div class="line-numbers" id="line-numbers">1</div>
                <textarea id="code-input" placeholder="Paste your code or text here..." oninput="updateLineNumbers()"></textarea>
            </div>
        </div>
    </div>

    <script>
        function updateLineNumbers() {
            const textarea = document.getElementById('code-input');
            const lineNumbers = document.getElementById('line-numbers');
            const lines = textarea.value.split('\n').length;
            lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
        }

        function copyCode() {
            const code = document.getElementById('code-input').value;
            if(!code) return alert('Chưa có nội dung để copy!');
            navigator.clipboard.writeText(code);
            alert('Đã sao chép nội dung vào bộ nhớ tạm! 🎉');
        }

        function savePaste() {
            const code = document.getElementById('code-input').value;
            if(!code) return alert('Vui lòng nhập nội dung trước khi lưu!');
            alert('Đã lưu paste thành công! 🎉');
        }

        function openRaw() {
            const code = document.getElementById('code-input').value;
            const newWin = window.open('');
            newWin.document.write('<pre>' + code.replace(/</g, "&lt;").replace(/>/g, "&gt;") + '</pre>');
        }

        function clearEditor() {
            document.getElementById('code-input').value = '';
            document.getElementById('title').value = 'Untitled paste...';
            updateLineNumbers();
        }
    </script>
</body>
</html>
